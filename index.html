<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Naskh+Arabic:wght@400;700&family=Noto+Sans+Arabic:wght@400;700;900&family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <img class="logo" src="logo.svg" alt="Studio logo">
    <div class="brand">Studio</div>
    <input id="docName" class="docname" value="Untitled" aria-label="Document name">
    <select id="templates" aria-label="Templates">
      <option value="" data-i18n="templates">Templates</option>
      <option value="post">Social post</option>
      <option value="poster">Poster</option>
      <option value="story">Story</option>
    </select>
    <div class="spacer"></div>
    <button id="undoBtn" data-i18n="undo">Undo</button>
    <button id="redoBtn" data-i18n="redo">Redo</button>
    <button id="openBtn" data-i18n="open">Open</button>
    <button id="saveBtn" data-i18n="save">Save</button>
    <select id="expFmt" aria-label="Format"><option value="png">PNG</option><option value="jpg">JPG</option></select>
    <select id="expScale" aria-label="Scale"><option value="1">1×</option><option value="2" selected>2×</option><option value="3">3×</option></select>
    <button id="exportBtn" class="primary" data-i18n="export">Export</button>
    <select id="lang" aria-label="Language">
      <option value="en">English</option>
      <option value="ku">کوردی</option>
      <option value="ar">العربية</option>
    </select>
  </header>

  <div class="main">
    <nav class="tools">
      <button data-tool="select" title="V"><span class="g">↖</span><span data-i18n="tool_select">Select</span></button>
      <button data-tool="text" title="T"><span class="g">T</span><span data-i18n="tool_text">Text</span></button>
      <button data-tool="rect" title="R"><span class="g">▭</span><span data-i18n="tool_rect">Rectangle</span></button>
      <button data-tool="ellipse" title="O"><span class="g">◯</span><span data-i18n="tool_ellipse">Ellipse</span></button>
      <button data-tool="brush" title="B"><span class="g">✎</span><span data-i18n="tool_brush">Brush</span></button>
      <button data-tool="eraser" title="E"><span class="g">⌫</span><span data-i18n="tool_eraser">Eraser</span></button>
      <button data-tool="hand" title="H"><span class="g">✋</span><span data-i18n="tool_hand">Hand</span></button>
      <hr>
      <button id="addImage" data-i18n="add_image">Add image</button>
      <label class="row"><span data-i18n="brush_size">Brush size</span><input id="brushSize" type="range" min="1" max="120" value="16"></label>
      <label class="row"><span data-i18n="brush_color">Brush colour</span><input id="brushColor" type="color" value="#7c5cff"></label>
      <hr>
      <label class="stack"><span data-i18n="artboard">Artboard</span>
        <select id="sizePreset">
          <option value="1080,1080">Square 1080×1080</option>
          <option value="1080,1920">Story 1080×1920</option>
          <option value="1200,1600">Poster 1200×1600</option>
          <option value="1200,628">Link 1200×628</option>
          <option value="1920,1080">Landscape 1920×1080</option>
        </select>
      </label>
      <label class="row"><span data-i18n="background">Background</span><input id="bgColor" type="color" value="#ffffff"></label>
      <label class="row"><input id="bgTransparent" type="checkbox"><span data-i18n="transparent">Transparent</span></label>
    </nav>

    <section class="stage-wrap">
      <canvas id="stage"></canvas>
      <div class="zoombar">
        <button id="zoomOut" aria-label="Zoom out">−</button>
        <span id="zoomPct">100%</span>
        <button id="zoomIn" aria-label="Zoom in">+</button>
        <button id="fitBtn" data-i18n="fit">Fit</button>
      </div>
    </section>

    <aside class="side">
      <section>
        <h4 data-i18n="layers">Layers</h4>
        <div class="btnrow">
          <button id="zUp" title="]">↑</button>
          <button id="zDown" title="[">↓</button>
          <button id="dupBtn" data-i18n="duplicate">Duplicate</button>
          <button id="delBtn" class="danger" data-i18n="delete">Delete</button>
        </div>
        <div id="layerList" class="layers"></div>
      </section>

      <section>
        <h4 data-i18n="properties">Properties</h4>
        <div id="props"></div>
      </section>

      <section>
        <h4 data-i18n="ai">AI tools</h4>
        <div class="btnrow col">
          <button id="aiRemoveBg" data-i18n="remove_bg">Remove background</button>
          <button id="aiGenerate" data-i18n="generate">Generate image</button>
          <button id="aiTranslate" data-i18n="translate">Translate to Kurdish + Arabic</button>
        </div>
        <label class="stack"><span data-i18n="api_key">OpenAI API key</span>
          <input id="apiKey" type="password" placeholder="sk-…" autocomplete="off">
        </label>
        <p class="hint" data-i18n="api_hint">Stored only in this browser.</p>
      </section>
    </aside>
  </div>

  <footer class="status">
    <span id="coords"></span>
    <span id="docInfo"></span>
    <span>Made by Hewa Khoshnaw</span>
  </footer>

  <input id="fileInput" type="file" accept="image/*" hidden>
  <input id="openFile" type="file" accept=".json,application/json" hidden>
  <div id="toast"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
