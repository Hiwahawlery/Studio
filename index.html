<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Studio · Hewa KHoshnaw</title>
<link rel="icon" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Noto+Sans+Arabic:wght@400;700&family=Noto+Sans+SC:wght@400;700&display=swap">
<link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
<header class="top">
  <div class="brand"><img src="logo.svg" alt=""><b>Studio</b></div>
  <select id="tpl" title="Templates"><option value="">Templates</option><option value="headline">Headline card</option></select>
  <button class="btn" id="undo" data-i18n="undo">Undo</button>
  <button class="btn" id="redo" data-i18n="redo">Redo</button>
  <button class="btn" id="open" data-i18n="open">Open</button>
  <button class="btn" id="save" data-i18n="save">Save</button>
  <select id="fmt" title="Format"><option value="png">PNG</option><option value="jpeg">JPG</option></select>
  <select id="scale" title="Scale"><option value="1">1×</option><option value="2" selected>2×</option><option value="3">3×</option></select>
  <button class="btn primary" id="export" data-i18n="export">Export</button>
  <button class="btn" id="theme" title="Dark mode">☾</button>
  <select id="lang" title="Language"><option value="en">English</option><option value="ku">کوردی</option><option value="ar">العربية</option><option value="zh">中文</option></select>
</header>
<nav class="tabs" id="tabs"></nav>

<div class="main">
  <aside class="left">
    <button class="tool on" data-tool="select" data-i18n="select">Select</button>
    <button class="tool" data-tool="text" data-i18n="text">Text</button>
    <button class="tool" data-tool="rect" data-i18n="rect">Rectangle</button>
    <button class="tool" data-tool="ellipse" data-i18n="ellipse">Ellipse</button>
    <button class="tool" data-tool="image" data-i18n="image">Add image</button>
    <label><span data-i18n="page">Page size</span><select id="preset"></select></label>
    <label><span data-i18n="orient">Orientation</span><select id="orient"><option value="p">Portrait</option><option value="l">Landscape</option></select></label>
    <label><span data-i18n="bg">Background</span><input id="bg" type="color" value="#ffffff"></label>
    <label class="row"><input id="transp" type="checkbox"> <span data-i18n="transparent">Transparent</span></label>
  </aside>

  <main class="stage">
    <canvas id="c"></canvas>
    <div class="zoom"><button class="btn" id="zm">−</button><span id="zv">50%</span><button class="btn" id="zp">+</button><button class="btn" id="fit">Fit</button></div>
  </main>

  <aside class="right">
    <h3 data-i18n="layers">Layers</h3>
    <div class="row"><button class="btn" id="up" title="Up">↑</button><button class="btn" id="down" title="Down">↓</button><button class="btn" id="dup" data-i18n="dup">Duplicate</button><button class="btn" id="del" data-i18n="del">Delete</button></div>
    <div id="layers" class="col"></div>

    <h3 data-i18n="props">Properties</h3>
    <div id="props" class="col"><p class="muted">Select a layer to edit it.</p></div>

    <h3 data-i18n="ai">AI tools</h3>
    <div class="col">
      <button class="btn" id="ghibli" data-i18n="ghibli">Ghibli style (AI)</button>
      <textarea id="prompt" rows="2" data-i18n-ph="prompt" placeholder="Describe an image"></textarea>
      <button class="btn" id="generate" data-i18n="generate">Generate image</button>
      <button class="btn" id="translate" data-i18n="translate">Translate to Kurdish + Arabic</button>
      <label><span data-i18n="key">Gemini API key (free)</span><input id="key" type="password" placeholder="AIza..."></label>
      <small data-i18n="keyNote">Free key from aistudio.google.com. Stored only in this browser.</small>
      <p id="aiMsg" class="muted"></p>
    </div>
  </aside>
</div>

<footer class="bottom"><span id="pos">x 0 · y 0</span><span id="size"></span><span>Made by Hewa KHoshnaw</span></footer>

<input type="file" id="fileImg" accept="image/*" hidden>
<input type="file" id="fileOpen" accept=".json,application/json" multiple hidden>

<script src="i18n.js?v=3"></script>
<script src="presets.js?v=3"></script>
<script src="fonts.js?v=3"></script>
<script src="engine.js?v=3"></script>
<script src="ai.js?v=3"></script>
<script src="app.js?v=3"></script>
</body>
</html>
