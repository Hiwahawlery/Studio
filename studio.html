<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Studio · Hewa KHoshnaw</title>
<link rel="icon" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Noto+Sans+Arabic:wght@400;700&family=Noto+Sans+SC:wght@400;700&display=swap">
<style>
:root{--bg:#eceef4;--panel:#fff;--ink:#1c2230;--muted:#6b7385;--line:#dde1ea;--acc:#7c5cff;--stage:#dfe3ec}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14161d;--panel:#1d2030;--ink:#eef0f7;--muted:#9ba3b8;--line:#2e3347;--stage:#0f1117}}
:root[data-theme=dark]{--bg:#14161d;--panel:#1d2030;--ink:#eef0f7;--muted:#9ba3b8;--line:#2e3347;--stage:#0f1117}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--ink);font:14px/1.4 Inter,"Noto Sans Arabic","Noto Sans SC",system-ui,sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
.top{display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
.brand{display:flex;align-items:center;gap:6px;margin-inline-end:6px}
.brand img{width:26px;height:26px}
.main{display:grid;grid-template-columns:200px 1fr 300px;min-height:0}
.left,.right{background:var(--panel);overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.left{border-inline-end:1px solid var(--line)}
.right{border-inline-start:1px solid var(--line)}
.stage{position:relative;overflow:auto;display:flex;background:var(--stage);padding:28px}
canvas{margin:auto;flex:none;box-shadow:0 10px 40px rgba(0,0,0,.3);background:#fff;touch-action:none}
.zoom{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px}
.bottom{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:0 12px;background:var(--panel);border-top:1px solid var(--line);color:var(--muted);font-size:12px}
.btn,.tool{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;text-align:start}
.btn:hover,.tool:hover{border-color:var(--acc)}
.btn:disabled{opacity:.5;cursor:default}
.primary,.tool.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.col{display:flex;flex-direction:column;gap:8px}
label{display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:12px}
label.row{flex-direction:row}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;width:100%}
input[type=color]{height:34px;padding:2px}
input[type=checkbox]{width:auto}
h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:6px 0 0}
.lay{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.lay.on{border-color:var(--acc);background:var(--bg)}
.lay span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lay input{width:auto}
.muted{color:var(--muted);margin:0}
#aiMsg{white-space:pre-wrap;font-size:12px;min-height:1em}
@media (max-width:900px){.main{grid-template-columns:1fr}.left,.right{max-height:36vh}.stage{min-height:60vh}}

.tabs{display:flex;align-items:flex-end;gap:2px;padding:4px 10px 0;background:var(--bg);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
.tab{display:flex;align-items:center;gap:6px;max-width:220px;height:100%;padding:0 6px 0 12px;background:var(--panel);opacity:.65;border:1px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;cursor:pointer;user-select:none}
.tab:hover{opacity:.9}
.tab.on{opacity:1;border-color:var(--acc);box-shadow:inset 0 2px 0 var(--acc)}
.tab span{overflow:hidden;text-overflow:ellipsis}
.tab .x,.tabs .add{border:0;background:none;cursor:pointer;padding:0 6px;border-radius:6px;color:var(--muted);font-size:16px;line-height:22px}
.tab .x:hover,.tabs .add:hover{background:var(--line);color:var(--ink)}
.tabs .add{align-self:center;margin-inline-start:4px}


/* Layout: fixed bars + flexible middle. Does not depend on grid row counting. */
.top{flex:none;height:48px}
.tabs{flex:none;height:36px}
.main{flex:1 1 0;min-height:0}
.bottom{flex:none;height:28px}
@media (max-width:900px){body{overflow:auto}.main{flex:none;min-height:0}}

/* Layer eye / lock buttons */
.ic{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;padding:0;border:0;background:none;border-radius:6px;color:var(--muted);cursor:pointer;flex:none}
.ic:hover{background:var(--line);color:var(--ink)}
.ic.act{color:var(--acc)}
.lay.off span{opacity:.4}
.lay.lk span{font-style:italic}
.lay{padding:4px 6px}
/* Hand tool (hold Space) */
.stage.hand,.stage.hand canvas{cursor:grab}
.stage.grabbing,.stage.grabbing canvas{cursor:grabbing}
/* Shortcuts window */
.modal{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.modal .card{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:14px;max-width:820px;width:100%;max-height:86vh;overflow:auto;padding:18px 22px}
.modal h2{margin:0 0 12px;font-size:16px}
.modal h4{margin:0 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px 28px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13px;align-items:center}
kbd{background:var(--bg);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;font:12px/1.4 ui-monospace,Consolas,monospace;white-space:nowrap}

</style>

<script>
addEventListener('error', e => { let b = document.getElementById('errbar');
  if (!b) { b = document.createElement('div'); b.id = 'errbar'; b.style.cssText = 'position:fixed;left:0;right:0;bottom:30px;z-index:99999;background:#b00020;color:#fff;font:13px/1.4 monospace;padding:8px 12px;white-space:pre-wrap'; document.body.append(b); }
  b.textContent += 'Error: ' + e.message + ' (' + (e.filename || '').split('/').pop() + ':' + e.lineno + ')\n'; });
</script>

<script>
// Fonts for Latin, Arabic-script text (Kurdish, Arabic, Persian) and Chinese. Loaded from Google Fonts in index.html.
const FONTS = {
  list: ['Inter', 'Noto Sans Arabic', 'Noto Sans SC'],
  // Each name falls back to system fonts that cover Arabic script and Chinese.
  stack: name => `"${name}", "Segoe UI", Tahoma, Arial, "Noto Sans Arabic", "Noto Sans SC", "Microsoft YaHei", sans-serif`,
  pending: new Set(),
  // Ask the browser to load a font, then call onReady so the canvas redraws with it.
  ensure(name, weight, onReady) {
    const probe = `${weight} 16px "${name}"`;
    if (!document.fonts || document.fonts.check(probe) || this.pending.has(probe)) return;
    this.pending.add(probe);
    document.fonts.load(probe).then(() => { this.pending.delete(probe); onReady(); }, () => this.pending.delete(probe));
  }
};

</script>
<script>
// Studio engine: document model, layers, drawing, undo/redo, tabs, export. No DOM controls here.
const Engine = (() => {
  const doc = { w: 1080, h: 1080, bg: '#ffffff', transparent: false, layers: [] };
  const IMG = new Map(); // layer id -> <img>. Images stay out of undo snapshots.
  const canvas = document.getElementById('c');
  const g = canvas.getContext('2d');
  const meas = document.createElement('canvas').getContext('2d');
  const listeners = [];
  let seq = 1, zoom = 0.5, selId = null, past = [], future = [], drag = null;

  // Tabs: the live document above belongs to tabs[cur]. Other tabs keep their state in .st
  const tabs = [{ id: 1, name: 'Untitled 1', dirty: false, st: null }];
  let cur = 0, tabSeq = 2, untitled = 2;

  const snap = () => JSON.stringify({ w: doc.w, h: doc.h, bg: doc.bg, transparent: doc.transparent, layers: doc.layers });
  const get = id => doc.layers.find(l => l.id === id) || null;
  const fontOf = L => `${L.italic ? 'italic ' : ''}${L.weight || 400} ${L.size}px ${FONTS.stack(L.font || 'Inter')}`;
  const loadImg = src => new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; });
  const markDirty = () => { tabs[cur].dirty = true; };

  function changed() { render(); listeners.forEach(f => f()); }
  function checkpoint() { markDirty(); past.push(snap()); if (past.length > 200) past.shift(); future = []; }
  function restore(s) { markDirty(); Object.assign(doc, JSON.parse(s)); if (!get(selId)) selId = null; changed(); }
  const undo = () => { if (past.length) { future.push(snap()); restore(past.pop()); } };
  const redo = () => { if (future.length) { past.push(snap()); restore(future.pop()); } };

  // ---------- Tabs ----------
  function stash() { // save the live document into the current tab
    tabs[cur].st = { w: doc.w, h: doc.h, bg: doc.bg, transparent: doc.transparent, layers: doc.layers, img: new Map(IMG), past, future, selId, zoom };
  }
  function activate(i) { // make tab i the live document
    cur = i; const s = tabs[i].st;
    drag = null;
    Object.assign(doc, { w: s.w, h: s.h, bg: s.bg, transparent: s.transparent, layers: s.layers });
    IMG.clear(); s.img.forEach((im, k) => IMG.set(k, im));
    past = s.past; future = s.future; selId = s.selId; zoom = s.zoom;
  }
  function addTab(name, state, imgs, reuse) {
    const st = { ...state, img: imgs || new Map(), past: [], future: [], selId: null, zoom: 0.5 };
    name = name || 'Untitled ' + untitled++;
    if (reuse) Object.assign(tabs[cur], { name, dirty: false, st });
    else { stash(); tabs.push({ id: tabSeq++, name, dirty: false, st }); cur = tabs.length - 1; }
    activate(cur); changed();
  }
  const newTab = () => addTab(null, { w: 1080, h: 1080, bg: '#ffffff', transparent: false, layers: [] });
  function switchTo(i) {
    if (i === cur || i < 0 || i >= tabs.length) return;
    stash(); activate(i); changed();
  }
  function switchToId(id) { // false if that tab was closed meanwhile
    const i = tabs.findIndex(t => t.id === id);
    if (i < 0) return false;
    switchTo(i); return true;
  }
  function closeTab(i) {
    if (i < 0 || i >= tabs.length) return;
    if (tabs.length === 1) { newTab(); tabs.splice(0, 1); cur = 0; changed(); return; }
    if (i === cur) { tabs.splice(i, 1); activate(Math.min(i, tabs.length - 1)); }
    else { tabs.splice(i, 1); if (i < cur) cur--; }
    changed();
  }
  function renameTab(i, name) { if (tabs[i]) { tabs[i].name = name; changed(); } }
  function markSaved() { tabs[cur].dirty = false; changed(); }

  // Open a saved project (text of a .studio.json file). Uses the current tab if it is still blank, otherwise a new tab.
  async function openProject(text, name) {
    let o;
    try { o = JSON.parse(text); } catch { throw new Error('Not valid JSON'); }
    if (!o || !Array.isArray(o.layers) || !(o.w > 0) || !(o.h > 0)) throw new Error('Not a Studio project');
    const imgs = new Map();
    await Promise.all(Object.entries(o.images || {}).map(([id, src]) => loadImg(src).then(im => imgs.set(id, im)).catch(() => {})));
    for (const L of o.layers) { const n = parseInt(String(L.id).replace(/\D/g, ''), 10); if (n >= seq) seq = n + 1; } // keep new ids unique
    for (const L of o.layers) if (!L.id) L.id = 'L' + seq++;
    const pristine = !tabs[cur].dirty && !doc.layers.length && !past.length;
    addTab(name, { w: +o.w, h: +o.h, bg: o.bg || '#ffffff', transparent: !!o.transparent, layers: o.layers }, imgs, pristine);
  }

  // Wrap text to the box width. Words wrap at spaces; long runs (Chinese has no spaces) break by character.
  function lines(L) {
    meas.font = fontOf(L);
    const out = [], W = L.w;
    const fit = t => {
      const o = []; let s = t;
      while (s.length > 1 && meas.measureText(s).width > W) {
        let k = s.length - 1;
        while (k > 1 && meas.measureText(s.slice(0, k)).width > W) k--;
        o.push(s.slice(0, k)); s = s.slice(k);
      }
      o.push(s); return o;
    };
    for (const para of String(L.text || '').split('\n')) {
      let cur = '';
      for (const word of para.split(' ')) {
        const t = cur ? cur + ' ' + word : word;
        if (!cur || meas.measureText(t).width <= W) { cur = t; continue; }

<script>
// Gemini calls. Get a free key at aistudio.google.com. The key is stored only in this browser (localStorage).
const AI = (() => {
  // Models are tried in order. If one is retired, unavailable to new users, or out of quota, the next is used.
  // If every listed model fails, the app asks Google which models this key can use and tries those.
  const TEXT_MODELS = ['gemini-3.5-flash-lite', 'gemini-3.5-flash', 'gemini-3.1-flash-lite', 'gemini-2.5-flash'];
  const IMAGE_MODELS = ['gemini-3.1-flash-image', 'gemini-3.1-flash-lite-image', 'gemini-3-pro-image', 'gemini-2.5-flash-image'];
  const KEY = 'studio_gemini_key';
  const BASE = 'https://generativelanguage.googleapis.com/v1beta/';
  const key = () => localStorage.getItem(KEY) || '';
  const setKey = k => localStorage.setItem(KEY, k.trim());
  const toBase64 = blob => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result.split(',')[1]); r.readAsDataURL(blob); });
  const worked = {}; // last model that worked, per kind: tried first next time
  const gone = /no longer available|not found|not supported|deprecated|shut down|not available|no longer supported/i;

  // Ask Google which models this key can call, newest first.
  async function discover(wantImage) {
    const r = await fetch(`${BASE}models?pageSize=200&key=${encodeURIComponent(key())}`);
    const j = await r.json().catch(() => ({}));
    const bad = /live|tts|audio|embed|robotics|veo|lyria|computer|deep-research|cyber/i;
    return (j.models || [])
      .filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
      .map(m => m.name.replace(/^models\//, ''))
      .filter(n => n.startsWith('gemini') && !bad.test(n) && (wantImage ? /image/.test(n) : !/image/.test(n) && /flash/.test(n)))
      .sort((a, b) => b.localeCompare(a, undefined, { numeric: true }));
  }

  async function tryModels(models, parts, wantImage, tried) {
    let last = '';
    for (const m of models) {
      if (tried.has(m)) continue;
      tried.add(m);
      const r = await fetch(`${BASE}models/${m}:generateContent?key=${encodeURIComponent(key())}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts }], generationConfig: wantImage ? { responseModalities: ['TEXT', 'IMAGE'] } : {} })
      });
      const j = await r.json().catch(() => ({}));
      if (r.ok) { worked[wantImage ? 'img' : 'txt'] = m; return { parts: j.candidates?.[0]?.content?.parts || [] }; }
      const msg = j.error?.message || `Gemini request failed (${r.status})`;
      last = `${m}: ${msg}`;
      // Wrong key or bad request: another model will not help.
      if (!(r.status === 404 || r.status === 429 || gone.test(msg))) return { error: msg };
    }
    return { error: last };
  }

  async function call(models, parts, wantImage) {
    if (!key()) throw new Error('Paste your free Gemini API key first.');
    const kind = wantImage ? 'img' : 'txt', tried = new Set();
    const order = worked[kind] ? [worked[kind], ...models] : models;
    let res = await tryModels(order, parts, wantImage, tried);
    if (res.parts) return res.parts;
    // Listed models all failed: use whatever this key can actually call.
    try { res = await tryModels(await discover(wantImage), parts, wantImage, tried) || res; } catch { /* keep first error */ }
    if (res.parts) return res.parts;
    throw new Error(res.error || 'Gemini request failed');
  }
  function toImage(parts) {
    const p = parts.find(x => x.inlineData);
    if (!p) throw new Error('No image came back. Try a clearer description.');
    return `data:${p.inlineData.mimeType};base64,${p.inlineData.data}`;
  }

  return {
    build: 6, key, setKey,
    generate: prompt => call(IMAGE_MODELS, [{ text: prompt }], true).then(toImage),
    edit: (blob, prompt) => toBase64(blob).then(data =>
      call(IMAGE_MODELS, [{ text: prompt }, { inlineData: { mimeType: blob.type || 'image/png', data } }], true)).then(toImage),
    translate: async text => {
      const parts = await call(TEXT_MODELS, [{ text: 'Translate the text below. Reply with ONLY JSON like {"ku":"...","ar":"..."}. "ku" = Kurdish (Sorani) written in Arabic script. "ar" = Modern Standard Arabic.\n\n' + text }], false);
      const m = parts.map(p => p.text || '').join('').match(/\{[\s\S]*\}/);
      if (!m) throw new Error('Translation failed. Try again.');
      return JSON.parse(m[0]);
    }
  };
})();

<script>

(() => {

  const tabName = () => E.tabs[E.tabIndex()].name.replace(/[\\/:*?"<>|]/g, '_');
  const fit = () => E.fitTo(stage.clientWidth, stage.clientHeight);

  // Page size and orientation
  Object.entries(PRESETS).forEach(([k, p]) => $('preset').add(new Option(`${p.label} · ${p.w}×${p.h}`, k)));

    const p = PRESETS[$('preset').value] || { w: D.w, h: D.h }; // 'custom' (from an opened file) keeps its size

  $('orient').onchange = () => { E.checkpoint(); applyPage(); };

  const ICON = {
    eye: SVG('<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>'),
    eyeOff: SVG('<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'),
    lock: SVG('<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>'),
    unlock: SVG('<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/>')
  };
  function refreshLayers() {
    const box = $('layers'), sel = E.selected();
    box.innerHTML = '';
    [...E.doc.layers].reverse().forEach(L => {
      const shown = L.visible !== false, locked = !!L.locked;
      const row = document.createElement('div');
      row.className = 'lay' + (L.id === sel ? ' on' : '') + (shown ? '' : ' off') + (locked ? ' lk' : '');
      const mk = (cls, html, title, fn) => { const b = document.createElement('button'); b.className = 'ic ' + cls; b.innerHTML = html; b.title = title; b.onclick = fn; return b; };
      const eye = mk(shown ? '' : 'act', shown ? ICON.eye : ICON.eyeOff, shown ? 'Hide (Alt+click: show only this layer)' : 'Show', ev => {
        if (ev.altKey) { const only = E.doc.layers.every(x => x.id === L.id || x.visible === false); E.bulk(x => { x.visible = only ? true : x.id === L.id; }); }
        else E.update(L.id, { visible: !shown });
      });
      const lock = mk(locked ? 'act' : '', locked ? ICON.lock : ICON.unlock, locked ? 'Unlock' : 'Lock (Alt+click: lock all others)', ev => {
        if (ev.altKey) E.bulk(x => { x.locked = x.id !== L.id; });
        else E.update(L.id, { locked: !locked });
      });
      const name = document.createElement('span');
      name.textContent = L.type === 'text' ? (L.text || 'Text').slice(0, 24) : L.type;
      row.append(eye, lock, name);
      row.onclick = e => { if (!e.target.closest('button')) E.select(L.id); };
      box.append(row);
    });
  }

  function refreshProps(L) {
    const box = $('props');
    box.innerHTML = '';
    if (!L) { box.innerHTML = '<p class="muted">Select a layer to edit it.</p>'; return; }
    const field = (label, el) => { const w = document.createElement('label'); w.append(label, el); box.append(w); };
    const num = (v, fn) => { const el = document.createElement('input'); el.type = 'number'; el.value = Math.round(v || 0); el.onchange = () => fn(+el.value || 0); return el; };
    const sel = (opts, v, fn) => { const el = document.createElement('select'); opts.forEach(([val, t]) => el.add(new Option(t, val))); el.value = v; el.onchange = () => fn(el.value); return el; };
    const col = (v, fn) => { const el = document.createElement('input'); el.type = 'color'; el.value = v; el.onchange = () => fn(el.value); return el; };
    const set = p => E.update(L.id, p);
    field('X', num(L.x, v => set({ x: v })));
    field('Y', num(L.y, v => set({ y: v })));
    if (L.type === 'text') {
      const ta = document.createElement('textarea'); ta.rows = 3; ta.value = L.text; ta.onchange = () => set({ text: ta.value });
      field('Text', ta);
      field('Font', sel(FONTS.list.map(n => [n, n]), L.font, v => set({ font: v })));
      field('Size', num(L.size, v => set({ size: v })));
      field('Weight', sel([[400, 'Regular'], [700, 'Bold']], L.weight, v => set({ weight: +v })));
      field('Align', sel([['left', 'Left'], ['center', 'Center'], ['right', 'Right']], L.align || 'left', v => set({ align: v })));
      field('Width', num(L.w, v => set({ w: v })));
      field('Color', col(L.fill, v => set({ fill: v })));
    }
    if (L.type === 'rect' || L.type === 'ellipse') {
      field('Width', num(L.w, v => set({ w: v })));
      field('Height', num(L.h, v => set({ h: v })));
      if (L.type === 'rect') field('Radius', num(L.r, v => set({ r: v })));
      field('Color', col(L.fill, v => set({ fill: v })));
    }
    if (L.type === 'image') {
      const ratio = L.h / L.w;
      field('Width', num(L.w, v => set({ w: v, h: Math.round(v * ratio) })));
    }
    if (L.locked) {
      box.querySelectorAll('input,select,textarea').forEach(el => { el.disabled = true; });
      const n = document.createElement('p'); n.className = 'muted'; n.textContent = t('lockedNote'); box.prepend(n);
    }
  }

  function refreshUI() {
    refreshTabs();
    refreshLayers();
    refreshProps(E.get(E.selected()));
    $('zv').textContent = Math.round(E.zoomNow() * 100) + '%';
    $('size').textContent = `${D.w} × ${D.h} px`;
    $('bg').value = D.bg; $('transp').checked = D.transparent;
    syncPage();
    const S = E.get(E.selected());
    ['up', 'down', 'dup', 'del'].forEach(id => { $(id).disabled = !S || !!S.locked; });
  }

  // AI tools (Gemini, free key from aistudio.google.com)
  const aiMsg = m => { $('aiMsg').textContent = m; };
  async function busy(btn, job) {
    btn.disabled = true; aiMsg('Working…');
    try { await job(); aiMsg('Done.'); } catch (err) { aiMsg('Error: ' + err.message); }
    btn.disabled = false;
  }
  // The user may switch tabs while the AI works. Return to the tab that started the job before adding results.
  const back = tid => { if (!E.switchToId(tid)) throw new Error('The tab was closed before the result arrived.'); };
  const copyLayer = (s, p) => { const o = { ...s, ...p }; delete o.id; return o; };
  $('generate').onclick = e => busy(e.currentTarget, async () => {
    const p = $('prompt').value.trim();
    if (!p) throw new Error('Type a description first.');
    const tid = E.tabId();
    const src = await AI.generate(p);
    back(tid); await E.addImage(src);
  });
  $('ghibli').onclick = e => busy(e.currentTarget, async () => {
    const s = E.get(E.selected()), tid = E.tabId();
    const src = s && s.type === 'image' ? E.IMG.get(s.id).src : E.exportCanvas(1).toDataURL('image/png');
    const blob = await (await fetch(src)).blob();
    const out = await AI.edit(blob, 'Redraw this image in the style of Studio Ghibli hand-painted anime: soft colors, detailed backgrounds, same subjects and composition. Return the image only.');
    back(tid); await E.addImage(out);
  });
  $('translate').onclick = e => busy(e.currentTarget, async () => {
    const s = E.get(E.selected()), tid = E.tabId();
    if (!s || s.type !== 'text' || !s.text) throw new Error('Select a text layer first.');
    const r = await AI.translate(s.text);
    back(tid);
    const a = E.add('text', copyLayer(s, { text: r.ku, font: 'Noto Sans Arabic', align: 'right', y: s.y + E.boxH(s) + 20 }));
    E.add('text', copyLayer(s, { text: r.ar, font: 'Noto Sans Arabic', align: 'right', y: a.y + E.boxH(a) + 20 }));
  });
  $('key').value = AI.key();
  $('key').onchange = e => AI.setKey(e.target.value);

  // ---- Shortcuts (Illustrator style). Letters use physical keys (e.code) so they also work on Kurdish/Arabic/Chinese layouts.
  // Keys: "+" joins keys of one shortcut, "|" separates alternatives.
  const HELP = [
    ['Tools', [['T', 'Add text'], ['M', 'Add rectangle'], ['L', 'Add ellipse'], ['Ctrl+Shift+P', 'Place image'], ['Space+drag', 'Pan (hand tool)'], ['Esc', 'Deselect']]],
    ['Edit', [['Ctrl+Z', 'Undo'], ['Ctrl+Shift+Z|Ctrl+Y', 'Redo'], ['Ctrl+C|Ctrl+X', 'Copy / Cut'], ['Ctrl+V', 'Paste'], ['Ctrl+Shift+V', 'Paste in place'], ['Ctrl+F', 'Paste in front'], ['Ctrl+B', 'Paste in back'], ['Ctrl+D', 'Duplicate'], ['Delete', 'Delete layer']]],
    ['Move', [['Arrows', 'Nudge 1 px'], ['Shift+Arrows', 'Nudge 10 px'], ['Shift+drag', 'Keep to one axis'], ['Alt+drag', 'Drag a copy']]],
    ['Arrange', [['Ctrl+]', 'Bring forward'], ['Ctrl+[', 'Send backward'], ['Ctrl+Shift+]', 'Bring to front'], ['Ctrl+Shift+[', 'Send to back']]],
    ['Lock & hide', [['Ctrl+2|Ctrl+Shift+L', 'Lock selected layer'], ['Ctrl+Alt+2|Ctrl+Alt+Shift+L', 'Unlock all'], ['Ctrl+3|Ctrl+Shift+H', 'Hide selected layer'], ['Ctrl+Alt+3|Ctrl+Alt+Shift+H', 'Show all'], ['Alt+click', 'On the eye: show only this layer'], ['Alt+click', 'On the lock: lock all other layers']]],
    ['View & file', [['Ctrl+0', 'Fit on screen'], ['Ctrl+1|Alt+1', 'Actual size (100%)'], ['Ctrl+=|Ctrl+-', 'Zoom in / out'], ['Ctrl+wheel|Alt+wheel', 'Zoom'], ['Ctrl+S', 'Save project'], ['Ctrl+O', 'Open project'], ['Ctrl+Shift+E', 'Export'], ['?|F1', 'This list']]]
  ];
  let helpEl = null;
  function toggleHelp(force) {
    const open = force !== undefined ? force : !helpEl;
    if (!open) { if (helpEl) { helpEl.remove(); helpEl = null; } return; }
    if (helpEl) return;
    helpEl = document.createElement('div'); helpEl.className = 'modal';
    const card = document.createElement('div'); card.className = 'card';
    const h = document.createElement('h2'); h.textContent = t('shortcuts') + '  ·  Ctrl = ⌘ on Mac';
    const cols = document.createElement('div'); cols.className = 'cols';
    HELP.forEach(([title, rows]) => {
      const sec = document.createElement('div'), h4 = document.createElement('h4'), kv = document.createElement('div');
      h4.textContent = title; kv.className = 'kv';
      rows.forEach(([k, d]) => {
        const keys = document.createElement('span');
        k.split('|').forEach((alt, i) => {
          if (i) keys.append(' or ');
          alt.split('+').forEach((part, j) => { if (j) keys.append('+'); const kb = document.createElement('kbd'); kb.textContent = part; keys.append(kb); });
        });
        const desc = document.createElement('span'); desc.textContent = d; kv.append(keys, desc);
      });
      if (title === 'Lock & hide') sec.style.gridColumn = '1 / -1';
      sec.append(h4, kv); cols.append(sec);
    });
    card.append(h, cols); helpEl.append(card); document.body.append(helpEl);
    helpEl.onclick = e => { if (e.target === helpEl) toggleHelp(false); };
  }
  if ($('help')) $('help').onclick = () => toggleHelp();

  // Hand tool: hold Space and drag to pan
  let pan = null;
  const setHand = v => { E.setHand(v); stage.classList.toggle('hand', v); if (!v) { pan = null; stage.classList.remove('grabbing'); } };
  stage.addEventListener('pointerdown', e => {
    if (!E.isHand()) return;
    pan = { x: e.clientX, y: e.clientY, l: stage.scrollLeft, t: stage.scrollTop };
    stage.setPointerCapture(e.pointerId); stage.classList.add('grabbing'); e.preventDefault();
  });
  stage.addEventListener('pointermove', e => { if (pan) { stage.scrollLeft = pan.l - (e.clientX - pan.x); stage.scrollTop = pan.t - (e.clientY - pan.y); } });
  stage.addEventListener('pointerup', () => { pan = null; stage.classList.remove('grabbing'); });
  addEventListener('keyup', e => { if (e.key === ' ') setHand(false); });
  addEventListener('blur', () => setHand(false));
  stage.addEventListener('wheel', e => {
    if (!(e.ctrlKey || e.altKey || e.metaKey)) return;
    e.preventDefault(); E.setZoom(E.zoomNow() * (e.deltaY < 0 ? 1.1 : 1 / 1.1));
  }, { passive: false });

  addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('input,textarea,select')) return;
    const c = e.code, mod = e.ctrlKey || e.metaKey, sh = e.shiftKey, alt = e.altKey, s = E.selected(), stop = () => e.preventDefault();
    if (e.key === ' ') { if (document.activeElement && document.activeElement.tagName === 'BUTTON') document.activeElement.blur(); stop(); setHand(true); return; }
    if (e.key === '?' || c === 'F1') { stop(); toggleHelp(); return; }
    if (c === 'Escape') { if (helpEl) toggleHelp(false); else E.select(null); return; }
    if (helpEl) return;
    if (mod) {
      const lock = c === 'Digit2' || (c === 'KeyL' && sh), hide = c === 'Digit3' || (c === 'KeyH' && sh);
      if (lock) { stop(); if (alt) E.bulk(L => { L.locked = false; }); else if (s) E.update(s, { locked: true }); }
      else if (hide) { stop(); if (alt) E.bulk(L => { L.visible = true; }); else if (s) E.update(s, { visible: false }); }
      else if (c === 'KeyZ') { stop(); sh ? E.redo() : E.undo(); }
      else if (c === 'KeyY') { stop(); E.redo(); }
      else if (c === 'KeyC') { if (s) { stop(); E.copy(s); } }
      else if (c === 'KeyX') { if (s) { stop(); E.cut(s); } }
      else if (c === 'KeyV') { stop(); E.paste(sh ? 'place' : 'offset'); }
      else if (c === 'KeyF') { stop(); E.paste('front'); }
      else if (c === 'KeyB') { stop(); E.paste('back'); }
      else if (c === 'KeyD') { if (s) { stop(); E.duplicate(s); } }
      else if (c === 'BracketRight') { if (s) { stop(); E.arrange(s, sh ? 'front' : 'forward'); } }
      else if (c === 'BracketLeft') { if (s) { stop(); E.arrange(s, sh ? 'back' : 'backward'); } }
      else if (c === 'KeyS') { stop(); $('save').click(); }
      else if (c === 'KeyO') { stop(); $('open').click(); }
      else if (c === 'KeyE' && sh) { stop(); $('export').click(); }
      else if (c === 'KeyP' && sh) { stop(); ADD.image(); }
      else if (c === 'Digit0') { stop(); fit(); }
      else if (c === 'Digit1') { stop(); E.setZoom(1); }
      else if (c === 'Equal' || c === 'NumpadAdd') { stop(); E.setZoom(E.zoomNow() * 1.25); }
      else if (c === 'Minus' || c === 'NumpadSubtract') { stop(); E.setZoom(E.zoomNow() / 1.25); }
      return;
    }
    if (alt && c === 'Digit1') { stop(); E.setZoom(1); return; }
    if (c.startsWith('Arrow') && s) {
      stop(); const n = sh ? 10 : 1;
      E.nudge(s, c === 'ArrowLeft' ? -n : c === 'ArrowRight' ? n : 0, c === 'ArrowUp' ? -n : c === 'ArrowDown' ? n : 0); return;
    }
    if ((e.key === 'Delete' || e.key === 'Backspace') && s) { stop(); E.remove(s); return; }
    if (!alt && !sh) {
      if (c === 'KeyT') { stop(); ADD.text(); }
      else if (c === 'KeyM') { stop(); ADD.rect(); }
      else if (c === 'KeyL') { stop(); ADD.ellipse(); }
    }
  });
  E.canvas.addEventListener('pointermove', e => { const [x, y] = E.toDoc(e); $('pos').textContent = `x ${Math.round(x)} · y ${Math.round(y)}`; });

  // Start
  E.onChange(refreshUI);
  $('preset').value = 'instagram';
  applyPage();
  setLang(localStorage.getItem('studio_lang') || 'en');
  fit();
  refreshUI();
})();

</script>
<script>
// Self-check: shows which files are out of date if the page is built from a mix of old and new files.
setTimeout(() => {
  const bad = [];
  if (getComputedStyle(document.body).display !== 'flex') bad.push('styles.css');
  if (typeof Engine === 'undefined' || Engine.build !== 6) bad.push('engine.js');
  if (typeof AI === 'undefined' || AI.build !== 6) bad.push('ai.js');
  if (typeof I18N === 'undefined' || !I18N.en.closeConfirm) bad.push('i18n.js');
  if (!document.querySelector('#tabs .tab')) bad.push('app.js');
  if (bad.length) { const b = document.createElement('div'); b.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:99999;background:#b00020;color:#fff;font:14px/1.5 sans-serif;padding:10px 14px'; b.textContent = 'These files on your server are OUT OF DATE: ' + bad.join(', ') + '. Upload the newest versions (or use the single-file studio.html) and hard refresh with Ctrl+Shift+R.'; document.body.append(b); }
}, 600);
</script>
